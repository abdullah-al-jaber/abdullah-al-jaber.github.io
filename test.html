<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Favicon Demo</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml"
        href="https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/home/default/24px.svg">

    &quot;start_url&quot;:&quot;.&quot;,

        &quot;src&quot;:&quot;https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/home/default/192px.svg&quot;,
        &quot;sizes&quot;:&quot;192x192&quot;,
        &quot;type&quot;:&quot;image/svg+xml&quot;

      {
        &quot;src&quot;:&quot;https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/home/default/512px.svg&quot;,
        &quot;sizes&quot;:&quot;512x512&quot;,
        &quot;type&quot;:&quot;image/svg+xml&quot;

    ]
  }">

  <meta name="theme-color" content="#ffffff">
</head>

  <h1>Mobile Favicon Demo</h1>
  <p>Try bookmarking this page or adding it to your home screen.</p>
