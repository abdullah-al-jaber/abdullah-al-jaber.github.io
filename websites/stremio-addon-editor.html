<!doctype html>
<html lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Stremio Addon Editor</title>
        <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/favicon/stremio-addon-editor.svg" />
        <link rel="icon" type="image/webp" sizes="512x512" href="/assets/favicon/stremio-addon-editor.webp" />
        <link rel="stylesheet" href="style/stremio-addon-editor.css" />
        <script type="module" src="script/stremio-addon-editor.js"></script>
    </head>

    <body>
        <header>Stremio Addon Editor</header>
        <main>
            <form id="login-load">
                <label for="email">
                    <span class="icon"><i class="fa-fw fa-duotone fa-solid fa-at"></i></span>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Email Address"
                        autocomplete="off"
                        required
                    />
                </label>
                <label for="password">
                    <span class="icon"><i class="fa-fw fa-duotone fa-solid fa-lock"></i></span>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Password"
                        autocomplete="off"
                        required
                    />
                </label>
                <button type="submit">
                    <span class="icon"><i class="fa-fw fa-duotone fa-solid fa-arrow-right-to-bracket"></i></span>
                    <span class="text">Login & Load</span>
                </button>
            </form>
            <form id="sync-save">
                <div id="top-box">
                    <span class="icon"><i class="fa-fw fa-duotone fa-solid fa-puzzle"></i></span>
                    <span class="title">Addon JSON</span>
                    <button type="button" id="copy-clipboard">
                        <i class="fa-fw fa-duotone fa-solid fa-copy"></i>
                    </button>
                    <button type="button" id="paste-clipboard">
                        <i class="fa-fw fa-duotone fa-solid fa-paste"></i>
                    </button>
                </div>
                <div id="bottom-box">
                    <textarea id="addon-json" placeholder="[ADDON JSON]" required></textarea>
                    <button type="submit">
                        <span class="icon"><i class="fa-fw fa-duotone fa-solid fa-arrows-rotate"></i></span>
                        <span class="text">Sync & Save</span>
                    </button>
                </div>
            </form>
        </main>
    </body>
</html>
